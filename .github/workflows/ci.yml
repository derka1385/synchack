name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # synchack runs on Macs (FSEvents, Bonjour): the full suite runs there.
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The server also runs on Linux (VMs, Docker).
  server-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --test-concurrency=1 test/server.test.ts test/tls.test.ts test/merge.test.ts test/paths.test.ts
      - run: docker build -t synchack .
